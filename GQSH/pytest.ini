[pytest]
addopts = -v --tb=short -W default::DeprecationWarning
markers =
    run: Legacy order marker; mapped to pytest-order via conftest
    order: pytest-order execution order
    oss2: Tests for OSS2 backend system
    scms: Tests for SCMS supplier system
    oms: Tests for OMS OSS2 admin APIs
    quality: Tests for Quality SCRM (gq-quality-scrm) APIs
filterwarnings =
    ignore::DeprecationWarning
